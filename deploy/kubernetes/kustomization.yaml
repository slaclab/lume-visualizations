apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lume-visualizations
resources:
  - namespace.yaml
  - configmap.yaml
  # EPICS mode: include ONE of the two configmap-epics-*.yaml files below.
  # - configmap-epics-fake.yaml   # for in-pod fake IOC (local/staging)
  # - configmap-epics-real.yaml   # for LCLS CA gateway (production)
  - configmap-epics-real.yaml
  - quad-scan.yaml
  - quad-scan-ingress.yaml

# The live-stream monitor now ships from webapp/ (see webapp/deploy/kubernetes).
# This kustomization retains only the quad-scan marimo app.

images:
  - name: ghcr.io/slaclab/lume-visualizations
    newTag: amsc-demo

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: lume-quad-scan
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - lume-quad-scan
          - --host
          - 0.0.0.0
          - --port
          - "2718"
          - --headless
